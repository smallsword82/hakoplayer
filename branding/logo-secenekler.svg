<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="1320" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3D7BFF"/>
      <stop offset="1" stop-color="#7A5CFF"/>
    </linearGradient>
    <!-- H'nin iki çubuğu (her seçenekte aynı) -->
    <g id="bars" fill="#FFFFFF">
      <path d="M32,36a3,3 0 0 1 3,-3h6a3,3 0 0 1 3,3v36a3,3 0 0 1 -3,3h-6a3,3 0 0 1 -3,-3z"/>
      <path d="M64,36a3,3 0 0 1 3,-3h6a3,3 0 0 1 3,3v36a3,3 0 0 1 -3,3h-6a3,3 0 0 1 -3,-3z"/>
    </g>
  </defs>
  <rect width="880" height="300" fill="#0B0F1A"/>

  <!-- 0: Mevcut -->
  <g transform="translate(25,30) scale(1.75)">
    <rect width="108" height="108" rx="24" fill="url(#bg)"/>
    <use href="#bars"/>
    <path d="M44,43L62,54L44,65z" fill="#FFFFFF"/>
  </g>
  <text x="119" y="250" fill="#E8ECF8" font-family="Segoe UI, Arial" font-size="18" font-weight="bold" text-anchor="middle">Şu anki</text>
  <text x="119" y="274" fill="#8B95B5" font-family="Segoe UI, Arial" font-size="14" text-anchor="middle">"sonraki ⏭" gibi duruyor</text>

  <!-- 1: Boşluklu -->
  <g transform="translate(245,30) scale(1.75)">
    <rect width="108" height="108" rx="24" fill="url(#bg)"/>
    <use href="#bars"/>
    <path d="M48.5,44L60,54L48.5,64z" fill="#FFFFFF"/>
  </g>
  <text x="339" y="250" fill="#E8ECF8" font-family="Segoe UI, Arial" font-size="18" font-weight="bold" text-anchor="middle">1 · Boşluklu</text>
  <text x="339" y="274" fill="#8B95B5" font-family="Segoe UI, Arial" font-size="14" text-anchor="middle">üçgen çubuklara değmiyor</text>

  <!-- 2: Renkli üçgen -->
  <g transform="translate(465,30) scale(1.75)">
    <rect width="108" height="108" rx="24" fill="url(#bg)"/>
    <use href="#bars"/>
    <path d="M47,43L61,54L47,65z" fill="#FFD24A"/>
  </g>
  <text x="559" y="250" fill="#E8ECF8" font-family="Segoe UI, Arial" font-size="18" font-weight="bold" text-anchor="middle">2 · Renkli üçgen</text>
  <text x="559" y="274" fill="#8B95B5" font-family="Segoe UI, Arial" font-size="14" text-anchor="middle">H beyaz, oynat sarı</text>

  <!-- 3: Klasik H, ortada oynat -->
  <g transform="translate(685,30) scale(1.75)">
    <rect width="108" height="108" rx="24" fill="url(#bg)"/>
    <use href="#bars"/>
    <rect x="43" y="46" width="22" height="16" rx="3" fill="#FFFFFF"/>
    <path d="M50.5,49.5L59.5,54L50.5,58.5z" fill="#5868FF"/>
  </g>
  <text x="779" y="250" fill="#E8ECF8" font-family="Segoe UI, Arial" font-size="18" font-weight="bold" text-anchor="middle">3 · Klasik H</text>
  <text x="779" y="274" fill="#8B95B5" font-family="Segoe UI, Arial" font-size="14" text-anchor="middle">yatay çizgide oynat oyuğu</text>
</svg>
